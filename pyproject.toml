[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.13.5,<0.14"]

[project]
name = "asd-cognition"
version = "0.1.0"
description = "Advanced System Design course project"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tzahi Taub", email = "tzahitoss@gmail.com" }]
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = ["click >= 8.1.8 "]

[dependency-groups]
dev = ["pytest", "pytest-cov>=7.1.0"]
docs = [
  "furo>=2025.12.19",
  "myst-parser>=5.2.0",
  "sphinx>=9.2.0",
  "sphinx-autobuild>=2025.08.25",
]

[tool.pytest]
ini_options.pythonpath = ["src"]

[tool.uv]
required-version = ">=0.13.5,<0.14"
